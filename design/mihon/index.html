<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ことば鍛冶(見本)</title>
    <link rel="stylesheet" href="./mihon.css" />
  </head>
  <body>
    <div class="ctl" id="ctl">
      <div class="grp"><span>画面</span>
        <button data-k="screen" data-v="idle">待機</button>
        <button data-k="screen" data-v="play">稽古中</button>
        <button data-k="screen" data-v="result">結果</button></div>
      <div class="grp" id="g-play"><span>稽古</span>
        <button data-k="play" data-v="normal">ふつう</button>
        <button data-k="play" data-v="miss">ミス</button>
        <button data-k="play" data-v="ippon">一本</button></div>
      <div class="grp" id="g-result"><span>結果</span>
        <button data-k="rank" data-v="dan">段</button>
        <button data-k="rank" data-v="kyu">級</button>
        <button data-k="note" data-v="on">知らせあり</button>
        <button data-k="note" data-v="off">知らせなし</button></div>
      <div class="grp"><span>筆の跡</span>
        <button data-k="brush" data-v="1">ふつう</button>
        <button data-k="brush" data-v="0.55">薄く</button>
        <button data-k="brush" data-v="0">なし</button></div>
    </div>
    <div id="root"></div>
    <script type="module" src="./mihon.js"></script>
  </body>
</html>
